name: Deploy to Cloudflare (mimo Higgsfield)

# Pri každom pushi do main: build + aplikuj D1 migrácie + deploy na Cloudflare Workers.
# = auto sync: keď sa zmení kód, verejná (heslom chránená) verzia sa sama nasadí.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install
      - name: Build (SSR Worker + assets)
        run: |
          set +e
          bun run build > build.out 2>&1
          code=$?
          echo "----- build output -----"
          cat build.out
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error TS|error during build|Transform failed|Error:|\.tsx?[:(]" build.out | head -60 | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=build-fail::$msg"
            exit $code
          fi
      - name: Apply D1 migrations (remote)
        run: |
          set +e
          bunx wrangler d1 migrations apply trilipy-kataster --remote --config wrangler.cf.jsonc > mig.out 2>&1
          code=$?
          echo "----- migration output -----"
          cat mig.out
          if [ $code -ne 0 ]; then
            msg=$(tail -40 mig.out | sed 's/\x1b\[[0-9;]*m//g;s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=migration-fail::$msg"
            exit $code
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: bunx wrangler deploy --config wrangler.cf.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
